name: flashflow

services:
  postgres:
    image: postgres:17.6-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: flashflow
      POSTGRES_USER: flashflow
      POSTGRES_PASSWORD: flashflow_dev
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashflow -d flashflow"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
    labels:
      com.flashflow.scope: project-local
